[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "a2r-decision"
version = "0.2.0"
description = "A2R predictive structural reading"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
openai = ["openai>=1.0"]

[project.scripts]
a2r = "a2r.__main__:main"

[tool.setuptools.packages.find]
include = ["a2r*"]
