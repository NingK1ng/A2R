[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "a2r-decision"
version = "0.1.0"
description = "A2R-Decision arbitration method"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
openai = ["openai>=1.0"]

[project.scripts]
a2r = "a2r.__main__:main"

[tool.setuptools.packages.find]
include = ["a2r*"]
